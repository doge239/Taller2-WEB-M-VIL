name: Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3
        with:
          # Evita el paquete obsoleto 'tools' incluido en los valores predeterminados de v3.
          packages: 'platform-tools'
      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Instalar frontend
        working-directory: frontend
        run: npm ci
      - name: Pruebas de lógica móvil
        working-directory: frontend
        run: npm run test:android
      - name: Build de producción y sincronización
        working-directory: frontend
        run: npm run android:sync
      - name: Compilar APK debug
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gestor-notas-debug-${{ github.run_number }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
